name: caseflow

services:
  postgres:
    image: postgres:17.7-alpine # official postgres image
    environment: # use above to initialize the database and user
      POSTGRES_DB: caseflow
      POSTGRES_USER: caseflow
      POSTGRES_PASSWORD: caseflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - caseflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseflow -d caseflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  caseflow-postgres-data:
